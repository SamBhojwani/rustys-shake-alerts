<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty's Shake Goal Alerts — Subscribe</title>
  <meta name="description" content="Get notified every time Bryan Rust scores a goal. Half-price Rusty's Shake at The Milkshake Factory!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Theme tokens ───────────────────────────────────────────── */
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --surface-input: #ffffff;
      --text: #1a1a1a;
      --text-muted: #5a5a5a;
      --text-faint: #888;
      --border: #e5e5e0;
      --border-strong: #c8c8c0;
      --accent: #FCB514;
      --accent-strong: #b58804;
      --on-accent: #1a1a1a;
      --error: #d33b32;
      --success: #2f8a47;
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.08);
      --radius: 6px;
      --radius-lg: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0a0a;
        --surface: #141414;
        --surface-input: #0a0a0a;
        --text: #f5f5f5;
        --text-muted: #a0a0a0;
        --text-faint: #6a6a6a;
        --border: #2a2a2a;
        --border-strong: #3a3a3a;
        --accent: #FCB514;
        --accent-strong: #fdc736;
        --on-accent: #0a0a0a;
        --error: #ff6b62;
        --success: #4cc16a;
        --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
      }
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-input: #0a0a0a;
      --text: #f5f5f5;
      --text-muted: #a0a0a0;
      --text-faint: #6a6a6a;
      --border: #2a2a2a;
      --border-strong: #3a3a3a;
      --accent: #FCB514;
      --accent-strong: #fdc736;
      --on-accent: #0a0a0a;
      --error: #ff6b62;
      --success: #4cc16a;
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Theme toggle ───────────────────────────────────────────── */
    .theme-toggle-wrap {
      position: absolute;
      top: 20px;
      right: 24px;
    }

    .theme-toggle {
      display: inline-flex;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }

    .theme-toggle button {
      background: transparent;
      border: none;
      padding: 5px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .theme-toggle button:hover {
      color: var(--text);
    }

    .theme-toggle button.on {
      background: var(--accent);
      color: var(--on-accent);
    }

    /* ── Card ───────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 460px;
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-strong);
      margin-bottom: 22px;
    }

    .mark::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 10px;
    }

    .headline em {
      font-style: italic;
      color: var(--accent-strong);
    }

    .intro {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .intro strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Form ───────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.18s;
    }

    .form-group input::placeholder { color: var(--text-faint); }
    .form-group input:focus { border-color: var(--text); }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      color: var(--on-accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, border-color 0.15s;
    }

    .submit-btn:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.5;
      display: none;
      text-align: center;
    }

    .message.success {
      display: block;
      background: rgba(47, 138, 71, 0.10);
      border: 1px solid rgba(47, 138, 71, 0.25);
      color: var(--success);
    }

    .message.error {
      display: block;
      background: rgba(211, 59, 50, 0.10);
      border: 1px solid rgba(211, 59, 50, 0.25);
      color: var(--error);
    }

    .foot {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 20px;
      text-align: center;
      line-height: 1.55;
    }

    @media (max-width: 520px) {
      .card { padding: 32px 24px; }
      .headline { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="theme-toggle-wrap">
    <div class="theme-toggle" role="group" aria-label="Color theme">
      <button type="button" data-theme-set="system">Auto</button>
      <button type="button" data-theme-set="light">Light</button>
      <button type="button" data-theme-set="dark">Dark</button>
    </div>
  </div>

  <div class="card">
    <div class="mark">Rusty's Shake · Goal Alerts</div>
    <h1 class="headline">Every goal,<br>a <em>shake</em>.</h1>
    <p class="intro">
      When <strong>Bryan Rust</strong> scores, you'll know — and so will your half-price
      <strong>Rusty's Shake</strong> at The Milkshake Factory.
    </p>

    <form id="subscribe-form" novalidate>
      <div class="form-group">
        <label for="name-input">Your name</label>
        <input type="text" id="name-input" name="name"
               placeholder="Sidney" required
               maxlength="100" autocomplete="given-name">
      </div>

      <div class="form-group">
        <label for="email-input">Email address</label>
        <input type="email" id="email-input" name="email"
               placeholder="you@example.com" required
               maxlength="254" autocomplete="email">
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        Subscribe to goal alerts
      </button>

      <div class="message" id="message" role="alert" aria-live="polite"></div>
    </form>

    <p class="foot">
      We'll send a confirmation email to verify your address.<br>
      No spam, ever. Unsubscribe anytime.
    </p>
  </div>

  <script>
    (function () {
      'use strict';

      // ── API configuration ──────────────────────────────────────
      var API_URL = 'https://6484tw3sc9.execute-api.us-east-1.amazonaws.com';

      var form = document.getElementById('subscribe-form');
      var nameInput = document.getElementById('name-input');
      var emailInput = document.getElementById('email-input');
      var submitBtn = document.getElementById('submit-btn');
      var messageEl = document.getElementById('message');

      var EMAIL_RE = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;

      function showMessage(type, text) {
        messageEl.className = 'message ' + type;
        messageEl.textContent = text;
      }

      function clearMessage() {
        messageEl.className = 'message';
        messageEl.textContent = '';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearMessage();

        var name = nameInput.value.trim();
        var email = emailInput.value.trim().toLowerCase();

        if (!name || name.length > 100) {
          showMessage('error', 'Please enter your name (max 100 characters).');
          nameInput.focus();
          return;
        }

        if (!email || !EMAIL_RE.test(email) || email.length > 254) {
          showMessage('error', 'Please enter a valid email address.');
          emailInput.focus();
          return;
        }

        if (!API_URL) {
          showMessage('error', 'Subscription is not yet configured. Please check back later.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Subscribing…';

        fetch(API_URL.replace(/\/+$/, '') + '/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, email: email })
        })
          .then(function (response) { return response.json(); })
          .then(function (data) {
            if (data.error) {
              showMessage('error', data.error);
            } else {
              showMessage('success', 'Check your inbox! We sent a confirmation link to verify your email.');
              form.reset();
            }
          })
          .catch(function () {
            showMessage('error', 'Something went wrong. Please try again later.');
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Subscribe to goal alerts';
          });
      });

      // ── Theme toggle ───────────────────────────────────────────
      var STORAGE_KEY = 'rusty.theme';
      var html = document.documentElement;

      function applyTheme(mode) {
        if (mode === 'system') {
          html.removeAttribute('data-theme');
        } else {
          html.setAttribute('data-theme', mode);
        }
        var buttons = document.querySelectorAll('[data-theme-set]');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].classList.toggle('on', buttons[i].getAttribute('data-theme-set') === mode);
        }
      }

      var saved;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { saved = null; }
      if (saved !== 'light' && saved !== 'dark' && saved !== 'system') saved = 'system';

      var togglerButtons = document.querySelectorAll('[data-theme-set]');
      for (var j = 0; j < togglerButtons.length; j++) {
        togglerButtons[j].addEventListener('click', function (e) {
          var mode = e.currentTarget.getAttribute('data-theme-set');
          try { localStorage.setItem(STORAGE_KEY, mode); } catch (err) { /* ignore */ }
          applyTheme(mode);
        });
      }

      applyTheme(saved);
    })();
  </script>
</body>
</html>
