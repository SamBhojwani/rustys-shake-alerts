<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty's Shake Goal Alerts — Subscribe</title>
  <meta name="description" content="Get notified every time Bryan Rust scores a goal. Half-price Rusty's Shake at The Milkshake Factory!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Theme tokens ───────────────────────────────────────────── */
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --surface-input: #ffffff;
      --text: #1a1a1a;
      --text-muted: #5a5a5a;
      --text-faint: #888;
      --border: #e5e5e0;
      --border-strong: #c8c8c0;
      --accent: #FCB514;
      --accent-strong: #b58804;
      --on-accent: #1a1a1a;
      --error: #d33b32;
      --success: #2f8a47;
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.08);
      --radius: 6px;
      --radius-lg: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0a0a;
        --surface: #141414;
        --surface-input: #0a0a0a;
        --text: #f5f5f5;
        --text-muted: #a0a0a0;
        --text-faint: #6a6a6a;
        --border: #2a2a2a;
        --border-strong: #3a3a3a;
        --accent: #FCB514;
        --accent-strong: #fdc736;
        --on-accent: #0a0a0a;
        --error: #ff6b62;
        --success: #4cc16a;
        --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
      }
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-input: #0a0a0a;
      --text: #f5f5f5;
      --text-muted: #a0a0a0;
      --text-faint: #6a6a6a;
      --border: #2a2a2a;
      --border-strong: #3a3a3a;
      --accent: #FCB514;
      --accent-strong: #fdc736;
      --on-accent: #0a0a0a;
      --error: #ff6b62;
      --success: #4cc16a;
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Theme switch (sun ↔ moon) ──────────────────────────────── */
    .theme-toggle-wrap {
      position: absolute;
      top: 20px;
      right: 24px;
    }

    .theme-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: 56px;
      height: 28px;
      padding: 0 7px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      color: var(--text-faint);
      transition: border-color 0.15s;
      outline: none;
    }

    .theme-switch:hover { border-color: var(--border-strong); }

    .theme-switch:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(252, 181, 20, 0.18);
    }

    .theme-switch .icon {
      width: 14px;
      height: 14px;
      display: block;
      position: relative;
      z-index: 2;
      transition: color 0.18s;
    }

    .theme-switch .thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .theme-switch[aria-checked="false"] .thumb { transform: translateX(0); }
    .theme-switch[aria-checked="false"] .icon-sun { color: var(--on-accent); }
    .theme-switch[aria-checked="false"] .icon-moon { color: var(--text-faint); }

    .theme-switch[aria-checked="true"] .thumb { transform: translateX(26px); }
    .theme-switch[aria-checked="true"] .icon-sun { color: var(--text-faint); }
    .theme-switch[aria-checked="true"] .icon-moon { color: var(--on-accent); }

    /* ── Card ───────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 460px;
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-strong);
      margin-bottom: 22px;
    }

    .mark::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 10px;
    }

    .headline em {
      font-style: italic;
      color: var(--accent-strong);
    }

    .intro {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .intro strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Form ───────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.18s;
    }

    .form-group input::placeholder { color: var(--text-faint); }
    .form-group input:focus { border-color: var(--text); }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      color: var(--on-accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, border-color 0.15s;
    }

    .submit-btn:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.5;
      display: none;
      text-align: center;
    }

    .message.success {
      display: block;
      background: rgba(47, 138, 71, 0.10);
      border: 1px solid rgba(47, 138, 71, 0.25);
      color: var(--success);
    }

    .message.error {
      display: block;
      background: rgba(211, 59, 50, 0.10);
      border: 1px solid rgba(211, 59, 50, 0.25);
      color: var(--error);
    }

    .foot {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 20px;
      text-align: center;
      line-height: 1.55;
    }

    @media (max-width: 520px) {
      .card { padding: 32px 24px; }
      .headline { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="theme-toggle-wrap">
    <button
      type="button"
      role="switch"
      class="theme-switch"
      id="theme-switch"
      aria-checked="false"
      aria-label="Toggle theme">
      <svg class="icon icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="2.6" />
        <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" />
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.2 9.3a5.6 5.6 0 1 1-6.5-7 4.5 4.5 0 0 0 6.5 7z" />
      </svg>
      <span class="thumb" aria-hidden="true"></span>
    </button>
  </div>

  <div class="card">
    <div class="mark">Rusty's Shake · Goal Alerts</div>
    <h1 class="headline">Every goal,<br>a <em>shake</em>.</h1>
    <p class="intro">
      When <strong>Bryan Rust</strong> scores, you'll know — and so will your half-price
      <strong>Rusty's Shake</strong> at The Milkshake Factory.
    </p>

    <form id="subscribe-form" novalidate>
      <div class="form-group">
        <label for="name-input">Your name</label>
        <input type="text" id="name-input" name="name"
               placeholder="Sidney" required
               maxlength="100" autocomplete="given-name">
      </div>

      <div class="form-group">
        <label for="email-input">Email address</label>
        <input type="email" id="email-input" name="email"
               placeholder="you@example.com" required
               maxlength="254" autocomplete="email">
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        Subscribe to goal alerts
      </button>

      <div class="message" id="message" role="alert" aria-live="polite"></div>
    </form>

    <p class="foot">
      We'll send a confirmation email to verify your address.<br>
      No spam, ever. Unsubscribe anytime.
    </p>
  </div>

  <script>
    (function () {
      'use strict';

      // ── API configuration ──────────────────────────────────────
      var API_URL = 'https://6484tw3sc9.execute-api.us-east-1.amazonaws.com';

      var form = document.getElementById('subscribe-form');
      var nameInput = document.getElementById('name-input');
      var emailInput = document.getElementById('email-input');
      var submitBtn = document.getElementById('submit-btn');
      var messageEl = document.getElementById('message');

      var EMAIL_RE = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;

      function showMessage(type, text) {
        messageEl.className = 'message ' + type;
        messageEl.textContent = text;
      }

      function clearMessage() {
        messageEl.className = 'message';
        messageEl.textContent = '';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearMessage();

        var name = nameInput.value.trim();
        var email = emailInput.value.trim().toLowerCase();

        if (!name || name.length > 100) {
          showMessage('error', 'Please enter your name (max 100 characters).');
          nameInput.focus();
          return;
        }

        if (!email || !EMAIL_RE.test(email) || email.length > 254) {
          showMessage('error', 'Please enter a valid email address.');
          emailInput.focus();
          return;
        }

        if (!API_URL) {
          showMessage('error', 'Subscription is not yet configured. Please check back later.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Subscribing…';

        fetch(API_URL.replace(/\/+$/, '') + '/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, email: email })
        })
          .then(function (response) { return response.json(); })
          .then(function (data) {
            if (data.error) {
              showMessage('error', data.error);
            } else {
              showMessage('success', 'Check your inbox! We sent a confirmation link to verify your email.');
              form.reset();
            }
          })
          .catch(function () {
            showMessage('error', 'Something went wrong. Please try again later.');
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Subscribe to goal alerts';
          });
      });

      // ── Theme switch (sun ↔ moon) ──────────────────────────────
      var STORAGE_KEY = 'rusty.theme';
      var html = document.documentElement;
      var themeSwitch = document.getElementById('theme-switch');
      var mql = window.matchMedia('(prefers-color-scheme: dark)');

      function readStored() {
        try {
          var v = localStorage.getItem(STORAGE_KEY);
          if (v === 'light' || v === 'dark') return v;
        } catch (e) { /* ignore */ }
        return null;
      }

      function applyTheme(mode) {
        // mode === null means: follow OS preference via CSS
        if (mode === 'dark' || mode === 'light') {
          html.setAttribute('data-theme', mode);
        } else {
          html.removeAttribute('data-theme');
        }
        var isDark = mode === 'dark' || (mode === null && mql.matches);
        themeSwitch.setAttribute('aria-checked', isDark ? 'true' : 'false');
        themeSwitch.setAttribute(
          'aria-label',
          isDark ? 'Switch to light mode' : 'Switch to dark mode'
        );
      }

      themeSwitch.addEventListener('click', function () {
        var next = themeSwitch.getAttribute('aria-checked') === 'true' ? 'light' : 'dark';
        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) { /* ignore */ }
        applyTheme(next);
      });

      // Follow OS changes as long as user hasn't picked explicitly.
      mql.addEventListener('change', function () {
        if (readStored() === null) applyTheme(null);
      });

      applyTheme(readStored());
    })();
  </script>
</body>
</html>
