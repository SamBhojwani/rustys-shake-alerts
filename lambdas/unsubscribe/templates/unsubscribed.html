<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribed — Rusty's Shake Alerts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #16213e;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .header {
      background: linear-gradient(135deg, #FCB514, #CDA347);
      padding: 32px 24px;
      text-align: center;
    }
    .header h1 {
      color: #000;
      font-size: 24px;
      line-height: 1.3;
    }
    .body-content {
      padding: 32px 28px;
      text-align: center;
    }
    .body-content .emoji {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .body-content p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .body-content .muted {
      color: #888;
      font-size: 14px;
    }
    .footer {
      padding: 20px 28px;
      background-color: #0f1629;
      text-align: center;
      border-top: 1px solid #2a2a4a;
    }
    .footer p {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>&#x1F3D2; Rusty&rsquo;s Shake Alerts</h1>
    </div>
    <div class="body-content">
      <div class="emoji">&#x1F44B;</div>
      <p><strong>You&rsquo;ve been unsubscribed.</strong></p>
      <p>
        You won&rsquo;t receive any more Rusty&rsquo;s Shake goal alerts.
        We&rsquo;re sorry to see you go!
      </p>
      <p class="muted">
        Changed your mind? You can always re-subscribe at any time.
      </p>
    </div>
    <div class="footer">
      <p>Rusty&rsquo;s Shake Goal Alerts &mdash; Pittsburgh, PA</p>
    </div>
  </div>
</body>
</html>
